apiVersion: apps/v1
kind: Deployment
metadata:
  name: kcd-keynote
  labels:
    app: kcd-keynote
    event: kcd-gujarat-2026
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kcd-keynote
  template:
    metadata:
      labels:
        app: kcd-keynote
        event: kcd-gujarat-2026
        speaker: sagar-utekar
    spec:
      containers:
        - name: keynote
          image: kcd-keynote:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kcd-keynote
  labels:
    app: kcd-keynote
spec:
  type: NodePort
  selector:
    app: kcd-keynote
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
